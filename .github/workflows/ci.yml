# vantage CI — all on GitHub Actions, by deliberate isolation design.
#
# Every per-PR build/smoke step runs the PR's own code (npm ci, build, pack,
# install, browser download, render). Running that on the operator's box (the
# earlier "local CI" experiment) put PR-controlled code on a trusted host with
# only a HOME-redirect + env-scrub between it and the filesystem — not a real
# sandbox. GitHub's hosted runners ARE disposable VMs, so the smoke lanes live
# here even though Actions bills by OS multiplier (Linux 1x, Windows 2x, macOS
# 10x, each job rounded up to the whole minute). Ubuntu (~1 min) + Windows
# (~4 min) per PR is the price of running untrusted build code off-host.
#
# Required checks (enforced by the branch-protection ruleset, NOT here):
#   - smoke (ubuntu) + smoke (windows) — this workflow, on every PR + main push.
#   - external review gate            — the external review gate (posted
#                                        outside CI; reviews the diff).
#
# What runs, and when:
#   - smoke (ubuntu) / smoke (windows) — pull_request + push to main. The full
#     pack -> scratch-install -> `vantage --smoke --ci` on both OSes. The
#     `--gate` cadence is exercised by the test suite (src/specs/gate.spec.ts),
#     so there is no separate gate-determinism step here.
#   - build-only (macos) — version tags ONLY. macOS (10x) is the one platform
#     with no local runtime; it validates the compile + tarball shape at release
#     time, where the rare 10-billed-minute cost is justified.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  smoke:
    # PRs + main pushes only (skipped on tag pushes — that's the macOS lane).
    # Matrix labels are explicit so the check contexts are exactly
    # `smoke (ubuntu)` / `smoke (windows)` (what the ruleset requires), not the
    # `…-latest` runner image names.
    name: smoke (${{ matrix.label }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: ubuntu }
          - { os: windows-latest, label: windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install + build
        run: |
          npm ci
          npm run build

      - name: Exports-resolution check
        # Guards the exports map: `import ... from 'vantage'` must resolve
        # under BOTH the import condition (ESM consumers) and the require
        # condition (CJS-default consumers, whose vantage.config.ts tsx
        # transpiles to require('vantage')). v0.7.0 shipped import-only and
        # broke `vantage --smoke` before browser launch on such consumers.
        run: node ci/exports-resolution-check.mjs

      - name: Pack tarball
        id: pack
        shell: bash
        run: |
          tarball="$(npm pack --silent)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Packed: $tarball"

      - name: Set up scratch dir + install packed tarball
        shell: bash
        run: |
          mkdir -p _ci_scratch
          cp ci/vantage.smoke.config.ts _ci_scratch/vantage.config.ts
          cp -r ci/fixture _ci_scratch/fixture
          cd _ci_scratch
          # No package-lock.json here — generate a minimal package.json so npm
          # has somewhere to put node_modules. The tarball install pulls
          # vantage as a real dep + we add @playwright/test (peerDep) and
          # http-server (the webServer in vantage.smoke.config.ts).
          # `type: module` matches the reference consumer's shape (an ESM
          # project). CJS-default consumers (npm init sets no "type") are
          # covered by the exports-resolution check above — vantage's exports
          # map must keep resolving under the require condition too.
          npm init -y >/dev/null
          npm pkg set type=module
          npm install --no-save \
            "../${{ steps.pack.outputs.tarball }}" \
            @playwright/test@^1.50.0 \
            http-server@^14.1.1

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          # Both OS cache locations; the key includes runner.os so Linux and
          # Windows caches never collide, and the tarball name so a version
          # bump invalidates.
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pack.outputs.tarball }}

      - name: Install Chromium browser
        shell: bash
        working-directory: _ci_scratch
        run: npx playwright install chromium

      - name: Run vantage --smoke
        shell: bash
        working-directory: _ci_scratch
        run: npx vantage --smoke --ci

      - name: Reject failed routes before content verdicts
        run: |
          npx playwright install chromium
          npm run test:route-failure

      - name: Validate gate-inert backstops + determinism
        # Runs the adversarial gate-inert harness — proves --gate rejects every
        # executable / suppression config surface (and that the rejected modules
        # never execute) AND that two renders produce an identical binding hash.
        # Wired into the REQUIRED `smoke (ubuntu)` check so the gate's own
        # guardrails are CI-ENFORCED, not merely documented. Ubuntu-only to stay
        # cheap (1x billed); the inert/determinism logic is platform-independent.
        # Builds dist + installs the repo-version chromium it needs.
        if: matrix.label == 'ubuntu'
        shell: bash
        run: |
          npm run build
          npx playwright install chromium
          node ci/gate-inert-validation.mjs

      - name: Upload last-run artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vantage-last-run-${{ matrix.label }}
          path: _ci_scratch/.vantage/last-run/
          retention-days: 7

  build-only:
    # Version tags only — the macOS (10x) compile/tarball validation at release.
    # No browser smoke (no Mac in the validation loop), but a compile-clean +
    # tarball-shape signal is cheap insurance against a Linux/Windows-only API.
    name: build-only (macos)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm pack --silent
